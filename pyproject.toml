[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf-plan"
version = "0.2.8"
description = "Tool-call safety gate + deterministic confirm tokens for agent workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "DirectiveProto"}]
dependencies = [
  "pydantic>=2.0,<3",
  "typing-extensions>=4.7",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://safetydf.com"
Documentation = "https://safetydf.com/docs"
Source = "https://github.com/directiveproto/sdf-plan"
Issues = "https://github.com/directiveproto/sdf-plan/issues"

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "build>=1.2.0",
  "twine>=5.0.0",
]

[project.scripts]
sdf-plan = "sdf_plan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sdf_plan.policy" = ["default_tool_map.json", "tool_map_v2.json"]
