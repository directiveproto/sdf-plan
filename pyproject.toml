[build-system]
requires = ["setuptools==68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf-plan"
version = "0.1.2"
description = "PlanSpec + lint + safety gates for agent plans."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "DirectiveProto"}]
dependencies = [
  "pydantic>=2.0,<3",
  "typing-extensions>=4.7",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/directiveproto/sdf-plangate-demo"
Source = "https://github.com/directiveproto/sdf-plan"
Issues = "https://github.com/directiveproto/sdf-plan/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "package: packaging and distribution smoke tests",
]
