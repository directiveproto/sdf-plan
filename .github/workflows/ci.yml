name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip ruff
      - run: ruff check .

  unit-and-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip pytest pytest-cov
      - run: python -m pip install -e .
      - run: python scripts/regenerate_golden.py
      - run: git diff --exit-code tests/fixtures/golden
      - run: pytest -q --cov=sdf_plan --cov-fail-under=70 tests/unit tests/contract tests/test_compat.py tests/test_preflight.py tests/test_version.py

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/integration

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest build twine
      - run: python -m pip install -e .
      - run: RUN_PACKAGE_TESTS=1 pytest -q tests/package -m package
